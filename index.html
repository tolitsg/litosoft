<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create JPG from Form</title>
</head>
<body>

  <h2>Fill the Form</h2>

  <label>Name:</label><br>
  <input type="text" id="name"><br><br>

  <label>Birthday:</label><br>
  <input type="date" id="birthday"><br><br>

  <label>Address:</label><br>
  <textarea id="address" rows="3"></textarea><br><br>

  <button onclick="createJPG()">Create JPG</button>

  <canvas id="canvas" width="800" height="600" style="display:none;"></canvas>

  <script>
    function createJPG() {
      const name = document.getElementById("name").value;
      const birthday = document.getElementById("birthday").value;
      const address = document.getElementById("address").value;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text
      ctx.fillStyle = "#000000";
      ctx.font = "30px Arial";
      ctx.fillText("Name: " + name, 50, 100);
      ctx.fillText("Birthday: " + birthday, 50, 150);

      ctx.fillText("Address:", 50, 200);
      const lines = address.split("\n");
      let y = 250;
      lines.forEach(line => {
        ctx.fillText(line, 50, y);
        y += 40;
      });

      // Convert to JPG
      const jpgUrl = canvas.toDataURL("image/jpeg");

      // Download JPG
      const link = document.createElement("a");
      link.href = jpgUrl;
      link.download = "info.jpg";
      link.click();

      alert("JPG created! Save it to your gallery, then send it in Messenger.");
    }
  </script>

</body>
</html>
