<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create JPG for Messenger</title>
</head>
<body>

  <h2>Fill the Form</h2>

  <label>Name:</label><br>
  <input type="text" id="name"><br><br>

  <label>Birthday:</label><br>
  <input type="date" id="birthday"><br><br>

  <label>Address:</label><br>
  <textarea id="address" rows="3"></textarea><br><br>

  <button onclick="createJPG()">Create JPG</button>

  <canvas id="canvas" width="900" height="600" style="display:none;"></canvas>

  <script>
    function createJPG() {
      const name = document.getElementById("name").value;
      const birthday = document.getElementById("birthday").value;
      const address = document.getElementById("address").value;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      // Background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text
      ctx.fillStyle = "#000000";
      ctx.font = "36px Arial";
      ctx.fillText("Name: " + name, 50, 100);
      ctx.fillText("Birthday: " + birthday, 50, 160);

      ctx.fillText("Address:", 50, 220);
      const lines = address.split("\n");
      let y = 280;
      lines.forEach(line => {
        ctx.fillText(line, 50, y);
        y += 40;
      });

      // Convert to JPG
      const jpgUrl = canvas.toDataURL("image/jpeg");

      // Download JPG
      const link = document.createElement("a");
      link.href = jpgUrl;
      link.download = "info.jpg";
      link.click();

      // Shareable link (opens in browser)
      const shareLink = window.location.href;

      alert(
        "JPG created!\n\n" +
        "1. Save the image to your gallery.\n" +
        "2. Open Messenger and send the JPG.\n" +
        "3. If you share this page link, it will open directly in the browser:\n\n" +
        shareLink
      );
    }
  </script>

</body>
</html>
