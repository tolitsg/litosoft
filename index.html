<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Text File</title>
</head>
<body>

  <h2>Fill the Form</h2>

  <label>Name:</label><br>
  <input type="text" id="name"><br><br>

  <label>Birthday:</label><br>
  <input type="date" id="birthday"><br><br>

  <label>Address:</label><br>
  <textarea id="address" rows="3"></textarea><br><br>

  <button onclick="generateTextFile()">Create Text File</button>

  <script>
    function generateTextFile() {
      const name = document.getElementById("name").value;
      const birthday = document.getElementById("birthday").value;
      const address = document.getElementById("address").value;

      const content =
        "Name: " + name + "\n" +
        "Birthday: " + birthday + "\n" +
        "Address:\n" + address + "\n";

      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "info.txt";
      link.click();

      URL.revokeObjectURL(url);
    }
  </script>

  <p>After downloading the file, open Facebook Messenger and send it as an attachment.</p>

</body>
</html>
